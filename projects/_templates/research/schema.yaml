project:
  id: "{{PROJECT_ID}}"
  name: "{{PROJECT_NAME}}"
  type: research
  stage: "{{STAGE}}"
  topic: "{{TOPIC}}"
structure:
  source: codes
  notes: notes
  outputs: outputs
compute:
  policy: server_preferred
  backend: ssh
  runner: explicit_per_task
  configuration_keys:
    - COMPUTE_PREFERRED_BACKEND
    - SSH_HOST
    - SSH_PORT
    - SSH_USER
artifact_policy:
  all_products_inside_project: true
  generated_directory: outputs
  credentials_in_artifacts: false
code_management:
  source: codes
  documentation: codes/docs
  experiments: codes/experiments
  analysis: codes/analysis
  tests: codes/tests
  run_evidence: outputs
